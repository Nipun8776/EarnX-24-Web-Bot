<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Earn Club NISH - Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-button-color: #248bcf;
            --tg-theme-button-text-color: #ffffff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f7f6);
            color: var(--tg-theme-text-color, #222);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #0088cc;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
            font-weight: bold;
        }
        h2 { margin-bottom: 10px; font-size: 22px; }
        p { color: #666; font-size: 14px; line-height: 1.5; }
        .btn {
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            padding: 15px 30px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.3s;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .channel-link {
            display: block;
            margin-top: 15px;
            color: #0088cc;
            text-decoration: none;
            font-size: 13px;
        }
        #status { margin-top: 15px; font-weight: bold; }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">F</div>
    <h2>Free Earn Club NISH</h2>
    <p>ඔබේ ගිණුම තහවුරු කිරීමට (Verify) ප්‍රථමයෙන් අපගේ Telegram Channel එක හා සම්බන්ධ වන්න.</p>
    
    <a href="https://t.me/FreeEarnClubNISH" target="_blank" class="channel-link">චැනල් එකට මෙතනින් යන්න →</a>

    <button id="verifyBtn" class="btn">Verify Account</button>
    
    <div id="status"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const verifyBtn = document.getElementById('verifyBtn');
    const statusDiv = document.getElementById('status');

    // Web App එක Initialize කිරීම
    tg.ready();
    tg.expand();

    verifyBtn.addEventListener('click', () => {
        const user = tg.initDataUnsafe.user;

        if (!user) {
            statusDiv.innerHTML = '<span class="error">කරුණාකර Telegram App එක හරහා පිවිසෙන්න.</span>';
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.innerText = "Checking...";

        // සටහන: සැබෑ ලෝකයේදී මෙහිදී Backend එකකට Data යවා 
        // Bot API එකෙන් (getChatMember) පරීක්ෂා කළ යුතුය.
        // දැනට බොට් හරහා පණිවිඩයක් යැවීම පමණක් සිදු කරයි.

        setTimeout(() => {
            statusDiv.innerHTML = `<span class="success">ස්තූතියි ${user.first_name}! <br> ඔබව සාර්ථකව හඳුනාගත්තා.</span>`;
            verifyBtn.innerText = "Verified ✅";
            
            // බොට් වෙත දත්ත යැවීම
            tg.sendData(JSON.stringify({
                status: "verified",
                user_id: user.id,
                username: user.username
            }));
            
        }, 2000);
    });
</script>

</body>
</html>
