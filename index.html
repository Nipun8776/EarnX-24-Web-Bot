<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Channel Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h2 { margin: 0 0 10px; font-size: 22px; color: #333; }
        p { font-size: 14px; color: #666; margin-bottom: 20px; }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:disabled { background-color: #ccc; }
        .link {
            display: block;
            margin-top: 15px;
            color: #0088cc;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
            font-size: 13px;
            font-weight: bold;
        }
        .error { background: #ffebee; color: #c62828; display: block !important; }
        .success { background: #e8f5e9; color: #2e7d32; display: block !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">📢</div>
    <h2>Free Earn Club NISH</h2>
    <p>පහත බොත්තම එබීමට පෙර අපගේ චැනල් එකට Join වී සිටිය යුතුය.</p>
    
    <a href="https://t.me/FreeEarnClubNISH" target="_blank" class="link">චැනල් එකට සම්බන්ධ වන්න →</a>
    
    <div id="message"></div>
    <br>
    <button id="verifyBtn" class="btn" onclick="checkMembership()">Verify Now</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const BOT_TOKEN = "8153175945:AAGuNLU1WZwQzzDkV-QdrQaI-JmODrlTkfE";
    const CHANNEL_ID = "@FreeEarnClubNISH";

    tg.ready();
    tg.expand();

    async function checkMembership() {
        const btn = document.getElementById('verifyBtn');
        const msg = document.getElementById('message');
        const user = tg.initDataUnsafe.user;

        if (!user) {
            msg.className = "error";
            msg.innerText = "දෝෂයකි: කරුණාකර Telegram හරහා මෙය විවෘත කරන්න.";
            return;
        }

        btn.disabled = true;
        btn.innerText = "පරීක්ෂා කරමින්...";
        msg.style.display = "none";

        try {
            // Telegram API වෙත සෘජුවම සාමාජිකත්වය පරීක්ෂා කිරීමට Request එකක් යැවීම
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getChatMember?chat_id=${CHANNEL_ID}&user_id=${user.id}`);
            const data = await response.json();

            if (data.ok) {
                const status = data.result.status;
                if (status === 'member' || status === 'administrator' || status === 'creator') {
                    msg.className = "success";
                    msg.innerText = "Verification සාර්ථකයි! ඔබ අපගේ සාමාජිකයෙක්.";
                    btn.innerText = "Verified ✅";
                    
                    // සාර්ථක නම් ටික වෙලාවකින් App එක වසා දමයි
                    setTimeout(() => { tg.close(); }, 2000);
                } else {
                    msg.className = "error";
                    msg.innerText = "ඔබ තවමත් අපගේ චැනල් එකට Join වී නැත.";
                    btn.disabled = false;
                    btn.innerText = "Verify Now";
                }
            } else {
                msg.className = "error";
                msg.innerText = "දෝෂයකි: බොට් චැනල් එකේ ඇඩ්මින් නොවේ.";
                btn.disabled = false;
                btn.innerText = "Verify Now";
            }
        } catch (error) {
            msg.className = "error";
            msg.innerText = "සම්බන්ධතා දෝෂයකි. නැවත උත්සාහ කරන්න.";
            btn.disabled = false;
            btn.innerText = "Verify Now";
        }
    }
</script>

</body>
</html>
